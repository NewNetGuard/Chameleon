<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="t d">
  <!-- Copyright (c) 2026 NewNetGuard. SPDX-License-Identifier: MPL-2.0 -->
  <title id="t">How Chameleon works</title>
  <desc id="d">Applications on your computer go through Chameleon, which sends everything inside one HTTPS connection that looks like Chrome to nginx on your VPS; nginx hands the tunnel to chameleon-server, which connects to the internet. A censor watching the connection sees Chrome browsing a website.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <rect x="20" y="30" width="320" height="170" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="56" fill="#9198a1" font-weight="600" font-size="13" letter-spacing="0.5">YOUR COMPUTER</text>
  <rect x="40" y="100" width="110" height="48" rx="8" fill="#21262d" stroke="#3d444d"/>
  <text x="95.0" y="129.0" text-anchor="middle" fill="#e6edf3" font-weight="600">Applications</text>
  <rect x="185" y="78" width="135" height="92" rx="8" fill="#21262d" stroke="#3d444d"/>
  <text x="252.5" y="111.0" text-anchor="middle" fill="#e6edf3" font-weight="600">Chameleon</text>
  <text x="252.5" y="129.0" text-anchor="middle" fill="#9198a1">kill switch · DNS</text>
  <text x="252.5" y="147.0" text-anchor="middle" fill="#9198a1">TCP streams</text>
  <line x1="150" y1="124" x2="181" y2="124" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="341" y1="124" x2="634" y2="124" stroke="#10b981" stroke-width="5" marker-end="url(#ag)"/>
  <text x="480" y="104" text-anchor="middle" fill="#e6edf3" font-weight="600">one HTTPS connection</text>
  <text x="480" y="150" text-anchor="middle" fill="#9198a1">Chrome TLS 1.3 + HTTP/2</text>
  <rect x="640" y="30" width="322" height="170" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="656" y="56" fill="#9198a1" font-weight="600" font-size="13" letter-spacing="0.5">YOUR VPS</text>
  <rect x="656" y="78" width="140" height="92" rx="8" fill="#21262d" stroke="#3d444d"/>
  <text x="726.0" y="111.0" text-anchor="middle" fill="#e6edf3" font-weight="600">nginx :443</text>
  <text x="726.0" y="129.0" text-anchor="middle" fill="#9198a1">real certificate</text>
  <text x="726.0" y="147.0" text-anchor="middle" fill="#9198a1">+ cover website</text>
  <rect x="812" y="100" width="136" height="48" rx="8" fill="#21262d" stroke="#3d444d"/>
  <text x="880.0" y="129.0" text-anchor="middle" fill="#e6edf3" font-weight="600">chameleon-server</text>
  <line x1="796" y1="124" x2="808" y2="124" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="1012" cy="124" r="40" fill="#21262d" stroke="#3d444d"/>
  <text x="1012" y="129" text-anchor="middle" fill="#e6edf3" font-weight="600">Internet</text>
  <line x1="948" y1="124" x2="968" y2="124" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="415" y="236" width="130" height="44" rx="8" fill="#21262d" stroke="#f0883e" stroke-dasharray="5 4"/>
  <text x="480" y="263" text-anchor="middle" fill="#f0883e" font-weight="600">Censor / DPI</text>
  <line x1="480" y1="236" x2="480" y2="160" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="480" y="80" text-anchor="middle" fill="#f0883e" font-style="italic">sees: Chrome browsing a website</text>
  </g>
</svg>
